
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <style>
        body { font-family: Arial; background: #f4f7fb; padding: 24px; }
        main { max-width: 650px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
        input, textarea { display: block; width: 95%; padding: 11px; margin: 8px 0 16px; }
        button { padding: 12px 18px; background: #2563eb; color: white; border: 0; cursor: pointer; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
<main>
    <h1>Checkout</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if items %}
        <h2>Order Summary</h2>
        {% for item in items %}
            <p>
                {{ item.product.name }} × {{ item.quantity }}
                — ₹{{ item.subtotal }}
            </p>
        {% endfor %}
        <h3>Total: ₹{{ total }}</h3>
    {% endif %}

    <h2>Shipping Details</h2>
    <form method="post">
        {% csrf_token %}

        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" maxlength="150" required>

        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" maxlength="20" required>

        <label for="shipping_address">Shipping address</label>
        <textarea id="shipping_address" name="shipping_address"
                  rows="4" maxlength="2000" required></textarea>

        <button type="submit">Place Order</button>
    </form>

    <p><a href="{% url 'cart' %}">Return to Cart</a></p>
</main>
</body>
</html>
