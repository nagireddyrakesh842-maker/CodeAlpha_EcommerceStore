
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Login</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; padding: 30px; }
        main { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; }
        input { display: block; width: 95%; padding: 10px; margin: 8px 0 16px; }
        button { padding: 10px 18px; background: #2563eb; color: white; border: 0; cursor: pointer; }
    </style>
    {% load static %}
<link rel="stylesheet" href="{% static 'products/style.css' %}">
</head>
<body>
<main>
    <h1>Customer Login</h1>

    {% if form.errors %}
        <p>Username or password is incorrect. Please try again.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log In</button>
    </form>

    <p>New customer? <a href="{% url 'register' %}">Create an account</a></p>
    <a href="{% url 'product_list' %}">Back to Store</a>
</main>
</body>
</html>
